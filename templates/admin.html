<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 聊天室</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-layout { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .admin-header h1 { font-size: 22px; color: var(--text); }
        .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .admin-tab {
            padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer;
            font-size: 14px; font-weight: 500; background: var(--white);
            color: var(--text-light); box-shadow: var(--shadow); transition: all .2s;
        }
        .admin-tab.active { background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: #fff; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: var(--white); border-radius: 16px; padding: 18px; text-align: center; box-shadow: var(--shadow); }
        .stat-card .num { font-size: 26px; font-weight: 700; color: var(--accent); }
        .stat-card .label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
        .admin-card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
        .list-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f5f1e1; flex-wrap: wrap; }
        .list-item:last-child { border-bottom: none; }
        .list-item .main { flex: 1; min-width: 160px; }
        .list-item .name { font-weight: 600; font-size: 14px; }
        .list-item .meta { font-size: 12px; color: var(--text-light); margin-top: 2px; }
        .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .pill-admin { background: #FFF3E0; color: #E65100; }
        .pill-muted { background: #FFCDD2; color: #C62828; }
        .pill-online { background: #C8E6C9; color: #2E7D32; }
        .pill-room { background: #E3F2FD; color: #1565C0; }
        .pill-msg { background: #F3E5F5; color: #6A1B9A; }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-xs { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
        .load-more { text-align: center; margin-top: 12px; }
        .mute-select { padding: 5px 8px; border: 1px solid #F0E68C; border-radius: 8px; font-size: 12px; background: var(--primary-light); }
        .empty { text-align: center; color: #bbb; padding: 30px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="admin-header">
            <h1>🛡️ 管理后台</h1>
            <div style="display:flex;gap:8px">
                <a href="/" class="btn btn-outline btn-sm">← 返回主页</a>
            </div>
        </div>

        <!-- Tab -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="stats" onclick="switchTab('stats')">📊 概览</button>
            <button class="admin-tab" data-tab="users" onclick="switchTab('users')">👥 用户</button>
            <button class="admin-tab" data-tab="rooms" onclick="switchTab('rooms')">🏠 房间</button>
            <button class="admin-tab" data-tab="messages" onclick="switchTab('messages')">💬 消息</button>
        </div>

        <!-- 概览 -->
        <div id="tab-stats">
            <div class="stat-grid" id="statsGrid"></div>
        </div>

        <!-- 用户 -->
        <div id="tab-users" style="display:none">
            <div class="admin-card">
                <div id="userList"></div>
            </div>
        </div>

        <!-- 房间 -->
        <div id="tab-rooms" style="display:none">
            <div class="admin-card">
                <div id="roomList"></div>
            </div>
        </div>

        <!-- 消息 -->
        <div id="tab-messages" style="display:none">
            <div class="admin-card">
                <div id="msgList"></div>
                <div class="load-more">
                    <button class="btn btn-outline btn-sm" onclick="loadMoreMessages()">加载更多</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/static/admin.js"></script>
</body>
</html>
