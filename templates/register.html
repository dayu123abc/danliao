<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 聊天室</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <div class="icon">✨</div>
            <h1>创建账号</h1>
            <p>一个手机号对应一个账号</p>
        </div>
        <div class="card">
            <form id="registerForm">
                <div class="input-group">
                    <label>昵称</label>
                    <input type="text" id="nickname" placeholder="给自己起个名字" maxlength="20" required>
                </div>
                <div class="input-group">
                    <label>手机号</label>
                    <input type="tel" id="phone" placeholder="请输入11位手机号" maxlength="11" required>
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="至少6位" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">注 册</button>
            </form>
        </div>
        <div class="auth-switch">
            已有账号？<a href="/login">去登录</a>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/static/register.js"></script>
</body>
</html>
